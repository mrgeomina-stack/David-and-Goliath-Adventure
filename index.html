<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#173e41" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2248%22%20height%3D%2248%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2212%22%20fill%3D%22%23315a52%22%2F%3E%3Cpath%20d%3D%22M24%206%2029%2019%2042%2024%2029%2029%2024%2042%2019%2029%206%2024%2019%2019Z%22%20fill%3D%22%23e4ba69%22%2F%3E%3C%2Fsvg%3E"
    />
    <title>David’s Big Adventure</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport">
      <main id="stage" aria-label="David’s Big Adventure game">
        <div id="game"></div>
        <header id="toolbar">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <div>DAVID’S<span>BIG ADVENTURE</span></div>
          </div>
          <nav aria-label="Teacher controls">
            <button id="pause">Ⅱ Pause</button
            ><button id="sound">♫ Sound on</button
            ><button id="language">ع / EN</button
            ><button id="fullscreen" title="Full screen">⛶</button
            ><button id="restart" title="Restart">↺</button
            ><button id="help" title="Teacher help">?</button>
          </nav>
        </header>
        <div id="mission" hidden>
          <span id="mission-badge"></span>
          <div>
            <div id="objective-ar" dir="rtl"></div>
            <div id="objective-en"></div>
          </div>
          <span id="progress"></span>
        </div>
        <section id="title" class="title-card">
          <div class="eyebrow">LITTLE HEARTS. GREAT COURAGE.</div>
          <div class="arabic-title" dir="rtl">مغامرة داود الكبرى</div>
          <h1>
            David’s<br /><em>Big Adventure</em
            ><span class="title-spark">✧</span>
          </h1>
          <p>
            One small shepherd.<br />A journey of courage, kindness & faith.
          </p>
          <div class="settings">
            <label
              >Adventure pace<select id="difficulty">
                <option value="easy">Easy · Little explorers</option>
                <option value="normal">Normal · Brave adventurers</option>
                <option value="free">Free play · Take your time</option>
              </select></label
            >
          </div>
          <button id="start" class="primary">Let’s begin <span>→</span></button
          ><button id="practice-toggle" class="text-button">
            Choose a mission <span>↗</span>
          </button>
          <div id="practice" hidden>
            <button data-mission="sheep">1 · Sheep</button
            ><button data-mission="maze">2 · Maze</button
            ><button data-mission="armor">3 · Armour</button
            ><button data-mission="brook">4 · Brook</button
            ><button data-mission="sling">5 · Goliath</button>
          </div>
          <small>1 SAMUEL 17 <b>•</b> AGES 5–8 <b>•</b> OFFLINE PLAY</small>
        </section>
        <div id="title-note">✦ &nbsp; Small steps. Big faith.</div>
        <div id="bottom" hidden>
          <div id="input-controls">
            <div id="directions">
              <button data-dir="0,-1" aria-label="Move up">↑</button
              ><button data-dir="-1,0" aria-label="Move left">←</button
              ><button data-dir="0,1" aria-label="Move down">↓</button
              ><button data-dir="1,0" aria-label="Move right">→</button>
            </div>
            <button id="action" class="primary"></button>
          </div>
          <div id="instruction"></div>
          <button id="hint">✧ Hint</button>
        </div>
        <div id="message" hidden>
          <div class="eyebrow" id="message-tag">A LITTLE MOMENT OF COURAGE</div>
          <h2 id="message-ar" dir="rtl"></h2>
          <p id="message-en"></p>
          <button id="continue" class="primary">Continue adventure →</button>
        </div>
        <div id="modal-backdrop" hidden>
          <section
            id="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
          >
            <span class="eyebrow">TEACHER’S CORNER</span>
            <h2 id="modal-title">A moment to pause</h2>
            <div id="modal-content"></div>
            <div id="modal-actions"></div>
          </section>
        </div>
        <div id="tutorial" hidden></div>
        <div id="toast" role="status" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
